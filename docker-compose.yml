services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: parking-api-backend
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: parking-api-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - app-network

  prisma-studio:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: parking-api-studio
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - app-network
    command: pnpm prisma studio --hostname 0.0.0.0


  db:
    image: postgres:15-alpine
    container_name: parking-api-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
